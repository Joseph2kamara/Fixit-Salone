name: Build installable Android APK
on:
  push:
    branches:
      - codex/android-apk-profession-suggestions
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        working-directory: mobile
        run: npm ci
      - name: Generate Android project
        working-directory: mobile
        env:
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: 309353199138-r8poji5ghpgvl61gba80rfrv9msf9t3v.apps.googleusercontent.com
        run: npx expo prebuild --platform android --no-install
      - name: Build installable APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: fixit-salone-profession-suggestions-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
